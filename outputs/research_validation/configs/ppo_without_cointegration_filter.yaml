data:
  start_date: '2020-01-01'
  end_date: '2021-06-01'
  assets_path: config/smoke_pairs.yaml
  price_type: Adj Close
  source: synthetic
  synthetic_periods: 320
  min_history: 220
  max_ffill_gap: 5
  resample_frequency: 1D
  quality_report_path: outputs/research_validation/ppo_without_cointegration_filter/data_quality_report.csv
  wavelet:
    enabled: true
    name: db4
    level: 2
    window: 32
pairs:
  correlation_threshold: 0.6
  allow_positive: false
  allow_negative: true
  use_cointegration: false
  cointegration_p_value: 0.1
  min_observations: 150
  traditional_min_annual_vol: null
  traditional_max_annual_vol: null
  inverse_min_annual_vol: null
  inverse_max_annual_vol: null
  max_traditional_pairs: 0
  max_inverse_pairs: 2
env:
  window_size: 30
  initial_capital: 100000
  max_position: 0.25
  max_total_exposure: 1.0
  transaction_cost: 0.0001
  slippage_cost: 0.0001
  cost_model: turnover
  borrow_fee_annual: 0.0025
  financing_rate_annual: 0.01
  cash_rate_annual: 0.0
  liquidity:
    enabled: true
    adv_window: 20
    max_trade_pct_adv: 0.05
features:
  min_periods: 50
  base_window: 30
rl:
  algorithm: PPO
  hyperparameters:
    policy: MlpPolicy
    learning_rate: 0.0003
    n_steps: 32
    batch_size: 32
    timesteps: 64
    n_epochs: 1
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.0
    vf_coef: 0.5
    max_grad_norm: 0.5
walkforward:
  enabled: true
  train_years: 0.75
  validation_months: 2
  test_months: 2
  min_train_size: 150
  min_validation_size: 30
  min_test_size: 30
  retrain_pairs_each_window: true
  retrain_env_each_window: true
  retrain_kelly_each_window: false
  mode: rolling
  feature_context_days: 189
  step_days: 42
validation:
  run_baselines: true
elasticnet:
  alpha: 0.01
  l1_ratio: 0.5
  max_iter: 5000
  importance_threshold: 0.0
kelly:
  fraction: 0.25
  leverage_cap: 1.0
  volatility_floor: 1e-6
reward:
  reward_clip: 5.0
  pos_penalty: 0.01
training:
  log_interval: 1
  save_dir: outputs/research_validation/ppo_without_cointegration_filter/models/ppo
  progress_bar: false
  tensorboard_log: null
evaluation:
  rolling_sharpe_window: 30
  rolling_sortino_window: 30
  rolling_vol_window: 30
  annualization_factor: 252
  save_equity_curve: true
  compare_to_spy: false
plotting:
  equity_curve: false
  compare_spy: false
  final_allocation: false
  return_distribution: false
  monthly_heatmap: false
  drawdown_curve: false
  ulcer_index_curve: false
  cdar_plot: false
  rolling_sharpe: false
  rolling_sortino: false
  rolling_vol: false
  trade_pnl_distribution: false
  gain_to_pain: false
logging:
  log_to_file: false
  log_path: outputs/research_validation/ppo_without_cointegration_filter/logs
  verbosity: INFO
system:
  seed: 42
  device: cpu
  num_workers: 1
output:
  run_dir: outputs/research_validation/ppo_without_cointegration_filter
