# ======================================================================
#                          DATA SETTINGS
# ======================================================================
data:
  start_date: "2014-01-01"
  end_date:   "2024-01-01"

  assets_path: "config/pairs.yaml"

  price_type: "Adj Close"
  min_history: 500
  resample_frequency: "1D"


# ======================================================================
#                       PAIR SELECTION SETTINGS
# ======================================================================
pairs:
  correlation_threshold: -0.8         # strong NEGATIVE correlation
  cointegration_p_value: 0.05
  min_observations: 400
  max_pairs: 15                       # reduced for laptop compute
  zscore_window: 30

  min_annual_vol: null
  max_annual_vol: null


# ======================================================================
#                         ENVIRONMENT SETTINGS
# ======================================================================
env:
  window_size: 30
  initial_capital: 100000

  # Risk / Exposure
  max_position: 0.25
  max_total_exposure: 5.0

  transaction_cost: 0.0001
  slippage_cost:     0.0001


# ======================================================================
#                     PPO REINFORCEMENT LEARNING
# ======================================================================
rl:
  algorithm: "PPO"

  hyperparameters:
    policy: "MlpPolicy"
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.00
    vf_coef: 0.50
    max_grad_norm: 0.50


# ======================================================================
#                     WALK-FORWARD TRAINING SETTINGS
# ======================================================================
walkforward:
  enabled: true

  train_years: 3
  test_months: 6

  min_train_size: 500
  min_test_size: 120

  retrain_pairs_each_window: true
  retrain_env_each_window: true
  retrain_kelly_each_window: false

  mode: "rolling"                # rolling | expanding


# ======================================================================
#                        KELLY POSITION SIZING
# ======================================================================
kelly:
  fraction: 0.25
  leverage_cap: 3.0
  volatility_floor: 1e-6


# ======================================================================
#                        REWARD FUNCTION WEIGHTS
# ======================================================================
reward:
  # === CORE REWARD STRUCTURE (22 metrics) ===
  lam_ret:      1.00
  lam_vol:      0.20
  lam_corr:     0.10
  lam_rollvol:  0.08
  lam_pos:      0.05
  lam_mr:       0.25
  lam_z:        0.08
  lam_trend:    0.20
  lam_kalman:   0.15
  lam_ols:      0.15
  lam_coint:    0.20
  lam_liq:      0.05
  lam_mom:      0.10
  lam_stab:     0.12

  # PPO stability
  reward_clip: 20


# ======================================================================
#                PPO TRAINING (SINGLE-WINDOW TRAIN MODE)
# ======================================================================
training:
  timesteps: 300000           # reduced for laptop; can raise later
  log_interval: 500
  save_dir: "models/ppo/"


# ======================================================================
#                        EVALUATION SETTINGS
# ======================================================================
evaluation:
  rolling_sharpe_window: 90
  rolling_sortino_window: 90
  rolling_vol_window: 90
  annualization_factor: 252

  save_equity_curve: true
  compare_to_spy: true


# ======================================================================
#                            PLOTTING SETTINGS
# ======================================================================
plotting:
  equity_curve: true
  compare_spy: true
  final_allocation: true
  return_distribution: true
  monthly_heatmap: true

  drawdown_curve: true
  ulcer_index_curve: true
  cdar_plot: true
  rolling_sharpe: true
  rolling_sortino: true
  rolling_vol: true
  trade_pnl_distribution: true
  gain_to_pain: true


# ======================================================================
#                            LOGGING
# ======================================================================
logging:
  log_to_file: true
  log_path: "logs/"
  verbosity: "INFO"


# ======================================================================
#                            SYSTEM
# ======================================================================
system:
  seed: 42
  device: "cpu"           # <--- IMPORTANT FOR YOUR LAPTOP
  num_workers: 1          # laptop = 1 worker only
