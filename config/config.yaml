# ======================================================================
#                          DATA SETTINGS
# ======================================================================
data:
  start_date: "2014-01-01"
  end_date: "2024-01-01"

  assets_path: "config/pairs.yaml"
  price_type: "Adj Close"
  min_history: 500
  resample_frequency: "1D"


# ======================================================================
#                       PAIR SELECTION SETTINGS
# ======================================================================
pairs:
  correlation_threshold: 0.8

  allow_positive: true
  allow_negative: true

  use_cointegration: true
  cointegration_p_value: 0.05

  min_observations: 300

  traditional_min_annual_vol: 0.15
  traditional_max_annual_vol: null

  inverse_min_annual_vol: null
  inverse_max_annual_vol: null

  max_traditional_pairs: 30
  max_inverse_pairs: null


# ======================================================================
#                         ENVIRONMENT SETTINGS
# ======================================================================
env:
  window_size: 30
  initial_capital: 100000

  max_position: 0.25
  max_total_exposure: 2.0

  transaction_cost: 0.0001
  slippage_cost: 0.0001


# ======================================================================
#                     PPO REINFORCEMENT LEARNING
# ======================================================================
rl:
  algorithm: "PPO"

  hyperparameters:
    policy: "MlpPolicy"
    learning_rate: 0.00015
    n_steps: 4096
    batch_size: 128
    timesteps: 2000000
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.00
    vf_coef: 0.50
    max_grad_norm: 0.50


# ======================================================================
#                     WALK-FORWARD TRAINING SETTINGS
# ======================================================================
walkforward:
  enabled: true

  train_years: 3
  test_months: 6

  min_train_size: 500
  min_test_size: 120

  retrain_pairs_each_window: true
  retrain_env_each_window: true
  retrain_kelly_each_window: false

  mode: "rolling"


# ======================================================================
#                        ELASTIC NET SETTINGS
# ======================================================================
elasticnet:
  alpha: 0.01
  l1_ratio: 0.5
  max_iter: 20000
  importance_threshold: 0.0


# ======================================================================
#                        KELLY POSITION SIZING
# ======================================================================
kelly:
  fraction: 0.25
  leverage_cap: 3.0
  volatility_floor: 1e-6


# ======================================================================
#                           REWARD SETTINGS
# ======================================================================
reward:
  reward_clip: 5.0
  pos_penalty: 0.01


# ======================================================================
#                PPO TRAINING SETTINGS
# ======================================================================
training:
  log_interval: 500
  save_dir: "models/ppo/"


# ======================================================================
#                        EVALUATION SETTINGS
# ======================================================================
evaluation:
  rolling_sharpe_window: 90
  rolling_sortino_window: 90
  rolling_vol_window: 90
  annualization_factor: 252

  save_equity_curve: true
  compare_to_spy: true


# ======================================================================
#                            PLOTTING SETTINGS
# ======================================================================
plotting:
  equity_curve: true
  compare_spy: true
  final_allocation: true
  return_distribution: true
  monthly_heatmap: true
  drawdown_curve: true
  ulcer_index_curve: true
  cdar_plot: true
  rolling_sharpe: true
  rolling_sortino: true
  rolling_vol: true
  trade_pnl_distribution: true
  gain_to_pain: true


# ======================================================================
#                            LOGGING
# ======================================================================
logging:
  log_to_file: true
  log_path: "logs/"
  verbosity: "INFO"


# ======================================================================
#                            SYSTEM
# ======================================================================
system:
  seed: 42
  device: "cpu"
  num_workers: 1
