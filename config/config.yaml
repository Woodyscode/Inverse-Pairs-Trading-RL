# ======================================================================
#                          DATA SETTINGS
# ======================================================================
data:
  start_date: "2014-01-01"
  end_date: "2024-01-01"

  assets_path: "config/pairs.yaml"
  price_type: "Adj Close"
  source: "yfinance"
  cache_path: "outputs/runs/cache/inverse_pairs_2014_2024.csv"
  min_history: 500
  max_ffill_gap: 5
  resample_frequency: "1D"
  quality_report_path: "outputs/audit/data_quality_report.csv"

  wavelet:
    enabled: true
    name: "db4"
    level: 3
    window: 64


# ======================================================================
#                       PAIR SELECTION SETTINGS
# ======================================================================
pairs:
  correlation_threshold: 0.8

  allow_positive: false
  allow_negative: true

  use_cointegration: true
  cointegration_p_value: 0.05
  multiple_testing: holm

  min_observations: 300

  traditional_min_annual_vol: 0.15
  traditional_max_annual_vol: null

  inverse_min_annual_vol: null
  inverse_max_annual_vol: null

  max_traditional_pairs: 30
  max_inverse_pairs: null


# ======================================================================
#                         ENVIRONMENT SETTINGS
# ======================================================================
env:
  window_size: 30
  initial_capital: 100000

  max_position: 0.25
  max_total_exposure: 2.0

  transaction_cost: 0.0001
  slippage_cost: 0.0001
  cost_model: "turnover"
  borrow_fee_annual: 0.005
  financing_rate_annual: 0.02
  cash_rate_annual: 0.00

  signal_lag_bars: 1
  liquidity:
    enabled: true
    adv_window: 20
    max_trade_pct_adv: 0.01


# ======================================================================
#                         FEATURE SETTINGS
# ======================================================================
features:
  min_periods: 60
  base_window: 30


# ======================================================================
#                     PPO REINFORCEMENT LEARNING
# ======================================================================
rl:
  algorithm: "PPO"

  hyperparameters:
    policy: "MlpPolicy"
    learning_rate: 0.00015
    n_steps: 4096
    batch_size: 128
    timesteps: 2000000
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.00
    vf_coef: 0.50
    max_grad_norm: 0.50


# ======================================================================
#                     WALK-FORWARD TRAINING SETTINGS
# ======================================================================
walkforward:
  enabled: true

  train_years: 3
  validation_months: 6
  test_months: 6

  min_train_size: 500
  min_test_size: 120

  retrain_pairs_each_window: true
  retrain_env_each_window: true
  retrain_kelly_each_window: false

  mode: "rolling"

validation:
  run_baselines: true


# ======================================================================
#                        ELASTIC NET SETTINGS
# ======================================================================
elasticnet:
  alpha: 0.01
  l1_ratio: 0.5
  max_iter: 20000
  importance_threshold: 0.0


# ======================================================================
#                        KELLY POSITION SIZING
# ======================================================================
kelly:
  fraction: 0.25
  leverage_cap: 3.0
  volatility_floor: 1e-6


# ======================================================================
#                           REWARD SETTINGS
# ======================================================================
reward:
  reward_clip: 5.0
  pos_penalty: 0.01


# ======================================================================
#                PPO TRAINING SETTINGS
# ======================================================================
training:
  log_interval: 500
  save_dir: "outputs/runs/full/models/ppo"
  progress_bar: false


# ======================================================================
#                        EVALUATION SETTINGS
# ======================================================================
evaluation:
  rolling_sharpe_window: 90
  rolling_sortino_window: 90
  rolling_vol_window: 90
  annualization_factor: 252

  save_equity_curve: true
  compare_to_spy: true


# ======================================================================
#                            PLOTTING SETTINGS
# ======================================================================
plotting:
  equity_curve: false
  compare_spy: false
  final_allocation: false
  return_distribution: false
  monthly_heatmap: false
  drawdown_curve: false
  ulcer_index_curve: false
  cdar_plot: false
  rolling_sharpe: false
  rolling_sortino: false
  rolling_vol: false
  trade_pnl_distribution: false
  gain_to_pain: false


# ======================================================================
#                            LOGGING
# ======================================================================
logging:
  log_to_file: true
  log_path: "logs/"
  verbosity: "INFO"


# ======================================================================
#                            SYSTEM
# ======================================================================
system:
  seed: 42
  device: "cpu"
  num_workers: 1


# ======================================================================
#                            OUTPUTS
# ======================================================================
output:
  run_dir: "outputs/runs/full"
